services:
  postgres-test:
    image: postgres:14-alpine
    container_name: tasman-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasman_test

    ports:
      - "5433:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasman_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data: